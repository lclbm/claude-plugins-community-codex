name: Codex package

on:
  push:
    branches: [codex]
  pull_request:
    branches: [codex]
  schedule:
    - cron: '37 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tests/check.py

  sync-and-release:
    needs: check
    if: github.repository == 'lclbm/claude-plugins-community-codex' && github.event_name != 'pull_request' && github.ref == 'refs/heads/codex'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finish the previous verified release before updating
        run: |
          python3 tests/check.py
          bash scripts/release.sh
      - name: Synchronize the complete upstream mirror
        run: gh api --method POST repos/lclbm/claude-plugins-community-codex/merge-upstream -f branch=main
      - name: Merge the complete upstream history
        run: |
          set -euo pipefail
          git fetch origin main
          upstream_sha=$(git rev-parse FETCH_HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "$upstream_sha"
          python3 scripts/build.py --upstream-sha "$upstream_sha"
          python3 tests/check.py
      - name: Publish the verified branch
        run: |
          set -euo pipefail
          git add html-plan LICENSE plugins codex-upstream.lock.json
          if ! git diff --cached --quiet || git rev-parse --verify -q MERGE_HEAD > /dev/null; then
            git commit -m "Sync html-plan and regenerate Codex package"
            git merge-base --is-ancestor FETCH_HEAD HEAD
            git push origin HEAD:codex
          fi
          git merge-base --is-ancestor FETCH_HEAD HEAD
      - name: Keep upstream workflows intact and inactive in this fork
        run: |
          set -euo pipefail
          gh api repos/lclbm/claude-plugins-community-codex/actions/workflows --jq '.workflows[] | select(.path != ".github/workflows/codex.yml" and .state != "disabled_manually") | .id' |
          while read -r workflow_id; do
            gh api --method PUT "repos/lclbm/claude-plugins-community-codex/actions/workflows/$workflow_id/disable"
          done
      - name: Package and publish a resumable release
        run: bash scripts/release.sh
